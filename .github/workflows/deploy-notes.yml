name: Deploy Notes to GitHub Pages

# workflow_dispatch：v5 分支（Quartz 工程）单独更新时，在 Actions 页面手动触发重新部署
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Notes/**'
      - 'Assets/**'
      - '.github/workflows/deploy-notes.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vault
        uses: actions/checkout@v4
        with:
          path: vault
          fetch-depth: 0

      - name: Checkout Quartz project
        uses: actions/checkout@v4
        with:
          ref: v5
          path: quartz

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: quartz/package-lock.json

      - name: Install dependencies
        working-directory: quartz
        run: npm ci

      - name: Install Quartz plugins
        working-directory: quartz
        run: npx quartz plugin install

      # 首页由脚本扫描真实文件夹生成，禁止改回手写链接（slug 小写规则曾导致首页全灭）
      - name: Sync Notes and Assets into Quartz content
        run: |
          rm -rf quartz/content
          mkdir -p quartz/content
          rsync -a --exclude='Agent' --exclude='Bevy' --exclude='UE' vault/Notes/ quartz/content/Notes/
          cp -r vault/Assets quartz/content/
          find quartz/content/Assets -name "*.md" -delete

      - name: Generate homepage from real folder structure
        working-directory: quartz
        run: node scripts/generate-index.mjs

      - name: Heal and demote links to unpublished notes
        working-directory: quartz
        run: node scripts/demote-private-links.mjs

      - name: Build Quartz site
        working-directory: quartz
        run: npx quartz build

      # CI 红线：任何站内死链都会让部署失败
      - name: Verify no broken internal links
        working-directory: quartz
        run: node scripts/check-links.mjs

      - name: Patch order into content index
        working-directory: quartz
        run: node scripts/patch-content-index-order.mjs content public/static/contentIndex.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: quartz/public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
